name: TaskManager CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore TaskManager.sln

      - name: Build solution
        run: dotnet build TaskManager.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test TaskManager.Testing/TaskManager.Testing.csproj --no-build --configuration Release